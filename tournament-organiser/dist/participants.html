<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Participant management preview · Tournament Organiser</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./styles/participants.css">
</head>
<body>
  <header><h1>Participant management preview</h1></header>
  <main>
    <p class="storage-note">Try managing an eight-player roster. Refresh the page to start over. <a href="./index.html">Back to tournaments</a></p>
    <section id="participant-preview" aria-label="Participant management"></section>
  </main>
  <script type="module">
    import {createTournament} from './tournament.js';
    import {initParticipantManagement, useEnglishValidation} from './modules/participants.js';

    useEnglishValidation(document);
    let preview = createTournament('Preview', 'preview');
    initParticipantManagement(document.querySelector('#participant-preview'), {
      getTournament: () => preview,
      onChange(next) { preview = next; }
    });
  </script>
</body>
</html>
